{% assign item = include.post %}
<a class="feature-card" href="{{ item.url | relative_url }}">
  <div class="feature-card__image">{% if item.cover %}<img src="{{ item.cover | relative_url }}" alt="Artwork for {{ item.title | escape }}" loading="lazy">{% else %}<span class="feature-card__image-fallback" aria-hidden="true">BirdBlog / Music</span>{% endif %}</div>
  <div class="feature-card__meta"><span>{{ item.review_kind | default: 'Feature' | upcase }}</span><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%d %b %Y' }}</time></div>
  <h3>{{ item.title }}</h3>
  {% if item.deck %}<p class="feature-card__deck">{{ item.deck }}</p>{% endif %}
  <span class="feature-card__read">Read feature ↗</span>
</a>
